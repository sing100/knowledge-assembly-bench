<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <!-- 知识组装台 · v4 hint-only guide -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知识组装台</title>
    <style>
      :root, :root[data-theme] {
        color-scheme: light;
        /* contemporary UI: light grey ground with a dot grid, white surfaces, hairline borders, indigo accent */
        --x-bg: #F7F7F8; --x-card: #FFFFFF; --x-hover: #F4F4F5;
        --x-ink: #18181B; --x-ink2: #71717A; --x-ink3: #A1A1AA;

        --x-acc: #4F46E5; --x-acc-h: #4338CA; --x-acc-l: #EEF2FF; --x-acc-r: rgba(79,70,229,.2);
        --x-ok: #16A34A; --x-ok-l: #F0FDF4; --x-ok-b: #BBF7D0; --x-ok-d: #15803D;
        --x-bad: #DC2626; --x-bad-l: #FEF2F2;
        --x-sh: 0 1px 2px rgba(0,0,0,.05); --x-sh-h: 0 4px 12px rgba(0,0,0,.08); --x-sh-drag: 0 12px 28px rgba(0,0,0,.12);
        --x-sh-float: 0 4px 16px rgba(0,0,0,.06); --x-sh-dlg: 0 24px 48px rgba(0,0,0,.16);
        /* branch colours */
        --x-br0: #4F46E5; --x-br1: #0EA5E9; --x-br2: #10B981; --x-br3: #F59E0B; --x-br4: #EC4899; --x-br5: #8B5CF6;
        /* motion */
        --m-fast: 60ms; --m-snap: 120ms; --m-base: 200ms; --m-sheet: 300ms; --m-slow: 450ms;
        --e-swift: cubic-bezier(.16,1,.3,1); --e-out: cubic-bezier(.165,.84,.44,1);
        --e-snap: cubic-bezier(.32,.72,0,1); --e-over: cubic-bezier(.34,1.3,.64,1);
        --e-spring: linear(0,.2459,.6526,.9468,1.0764,1.0915,1.0585,1.0219,.9993,.9914,.9921,.9957,.9988,1.0004,1);
        --x-ease: var(--e-swift);
        --x-font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body { background: var(--x-bg); color: var(--x-ink); font: 400 13px/1.4 var(--x-font); font-feature-settings: "tnum"; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overscroll-behavior: none; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      .x-app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0,1fr); grid-template-columns: minmax(0,1fr); max-width: none; margin: 0; padding: 0; gap: 0; }

      .x-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; line-height: 1.25; letter-spacing: -.01em; margin: 0; white-space: nowrap; }
      .x-brand i { width: 20px; height: 20px; border-radius: 6px; background: var(--x-acc); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); flex: none; }
      .x-sel { height: 32px; max-width: 170px; padding: 0 8px; border: 1px solid var(--x-ln); border-radius: 8px; background: var(--x-card); font: inherit; font-weight: 500; color: var(--x-ink); box-shadow: var(--x-sh); transition: border-color var(--m-base) var(--e-swift); }
      .x-sel:hover { border-color: var(--x-ln-h); }

      .x-tools { display: flex; gap: 2px; }

      .x-side { width: 280px; flex: none; box-sizing: border-box; background: var(--x-card); border-left: 1px solid var(--x-ln); padding: 20px 16px; overflow-y: auto; }
      .x-body.is-closed .x-side { display: none; }
      .x-side p { margin: 0 0 8px; font-size: 13px; line-height: 1.55; color: var(--x-ink2); }
      .x-rel { list-style: none; margin: 16px 0 0; padding: 16px 0 0; border-top: 1px solid var(--x-ln); display: grid; gap: 8px; font-size: 13px; color: var(--x-ink2); }
      .x-rel b { font-weight: 500; color: var(--x-ink); }
      .x-rel em { font-style: normal; font-weight: 600; color: var(--x-acc); }
      .x-rel__h { font-size: 12px; font-weight: 500; color: var(--x-ink2); }

      .x-prog { display: flex; align-items: center; gap: 10px; margin-left: auto; }
      .x-pbar { width: 120px; height: 4px; border-radius: 999px; background: var(--x-ln); overflow: hidden; }
      .x-pbar i { display: block; height: 100%; width: 0; background: var(--x-acc); border-radius: 999px; transition: width .5s var(--e-out); }

      .x-pbar.is-flash { animation: x-pblink 400ms var(--e-out); }

      .x-primary { height: 36px; padding: 0 16px; border-radius: 8px; background: var(--x-acc); color: #fff; font-weight: 500; box-shadow: var(--x-sh), inset 0 1px 0 rgba(255,255,255,.12); white-space: nowrap; }
      .x-primary:hover { background: var(--x-acc-h); }
      .x-sec-btn { height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--x-ln); background: var(--x-card); color: var(--x-ink); font-weight: 500; box-shadow: var(--x-sh); white-space: nowrap; }
      .x-sec-btn:hover { background: var(--x-hover); border-color: var(--x-ln-h); }
      .x-primary, .x-sec-btn { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; line-height: 1; }
      .x-primary:focus-visible, .x-sec-btn:focus-visible, .x-tb:focus-visible, .x-tab:focus-visible, .x-zoom button:focus-visible { outline: 2px solid var(--x-acc); outline-offset: 2px; }

      /* phone overflow menu, branch-focus pill */
      .x-tools { position: relative; }
      .x-morebtn { display: none; font-size: 16px; letter-spacing: 1px; }
      .x-more { position: absolute; top: calc(100% + 8px); right: 0; z-index: 90; display: flex; flex-direction: column; gap: 2px; min-width: 168px; padding: 4px; background: var(--x-card); border: 1px solid var(--x-ln); border-radius: 12px; box-shadow: var(--x-sh-float); }
      .x-more[hidden] { display: none; }
      .x-more .x-tb { text-align: left; padding: 0 12px; color: var(--x-ink); }
      .x-bpill { position: absolute; left: 16px; top: 16px; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; background: var(--x-card); border: 1px solid var(--x-ln); border-radius: 12px; box-shadow: var(--x-sh-float); white-space: nowrap; }
      .x-bpill[hidden] { display: none; }
      .x-bpill .x-ptxt { color: var(--x-ink); font-weight: 500; }
      .x-pseg { white-space: nowrap; }
      .x-chip.is-guide { border-color: var(--x-acc); background: var(--x-acc-l); color: var(--x-acc); box-shadow: 0 0 0 3px var(--x-acc-r); }

      .x-board { position: relative; flex: 1; min-height: 0; overflow: hidden; background-color: var(--x-bg);
        /* dot grid: only the third layer paints, so JS's four-layer size list keeps the 24px step in step with the view */
        background-image: none, none, radial-gradient(circle, var(--x-dot) 1px, transparent 1.5px);
        background-size: 120px 120px, 120px 120px, 24px 24px; touch-action: none; user-select: none; -webkit-user-select: none; }
      .x-board.is-space, .x-board.is-space .x-card { cursor: grab; }
      .x-board.is-pan, .x-board.is-pan .x-card { cursor: grabbing; }
      .x-world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; pointer-events: none; }
      .x-svg { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
      /* connectors: neutral 1.5px zinc (open link dashed), branch colour after the mind-map; small rounded heads */
      .x-edge .ln { fill: none; stroke: var(--x-ink3); stroke-width: 1.5; stroke-dasharray: 3 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#m-n); transition: stroke var(--m-base) var(--e-swift); }
      .x-edge.ok .ln { stroke: var(--x-ink3); stroke-dasharray: none; marker-end: url(#m-ok); }
      .x-edge.ok .hit { pointer-events: none; }
      .x-edge.bad .ln { stroke: var(--x-bad); stroke-dasharray: none; marker-end: url(#m-bad); }
      .x-edge.ink .ln { stroke: var(--x-ln-h); stroke-dasharray: none; marker-end: url(#m-ink); }
      .x-edge .hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
      .x-edge.ink .hit { pointer-events: none; }
      .m-n, .m-ok { fill: none; stroke: var(--x-ink3); } .m-bad { fill: none; stroke: var(--x-bad); } .m-ink { fill: none; stroke: var(--x-ln-h); }
      /* link preview while dragging from a port */
      .x-tmp { fill: none; stroke: var(--x-acc); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .55; marker-end: url(#m-acc); transition: opacity var(--m-snap) var(--e-out); }
      .x-tmp.is-snap { opacity: 1; stroke-width: 1.5; }
      .m-acc { fill: none; stroke: var(--x-acc); }
      .x-tend { fill: var(--x-acc); stroke: #fff; pointer-events: none; }
      .x-tmp.is-deny { stroke: var(--x-ink3); stroke-dasharray: 4 4; marker-end: none; }
      .x-no { fill: none; stroke: var(--x-ink3); stroke-width: 1.5; stroke-linecap: round; pointer-events: none; }
      .x-board.x-nocur, .x-board.x-nocur * { cursor: not-allowed !important; }
      .x-layer { position: absolute; left: 0; top: 0; }

      /* card: white, 10px radius, hairline border, 32px tall. The 8px dot + 8px gap is always reserved, so
         14 + 16 + text + 14 equals the old 20 + text + 24 and measured widths never change when a branch is set */
      .x-card { position: absolute; left: 0; top: 0; height: 32px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px; background: var(--x-card); border: 1px solid var(--x-ln); border-radius: 10px; box-shadow: var(--x-sh); outline: 2px solid transparent; outline-offset: 1px; font: 500 13px/1 var(--x-font); color: var(--x-ink); white-space: nowrap; pointer-events: auto; cursor: grab; scale: 1;
        transition: background-color var(--m-base) var(--e-swift), border-color var(--m-base) var(--e-swift), color var(--m-base) var(--e-swift), outline-color var(--m-base) var(--e-swift), box-shadow var(--m-snap) var(--e-snap), opacity var(--m-base) var(--e-swift), scale var(--m-snap) var(--e-snap); }
      .x-card.is-off, .x-edge.is-off, .x-lslot.is-off { opacity: .3; }
      .x-card.is-dim, .x-edge.is-dim, .x-lslot.is-dim { opacity: .25; }
      .x-edge { transition: opacity var(--m-base) var(--e-swift); }
      .x-side .x-rel1 { color: var(--x-ink); font-weight: 500; margin: 4px 0 8px; }
      .x-card::before { content: ""; flex: none; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--bt, var(--bt0, var(--x-ln-h))); box-shadow: 0 0 0 0 transparent; transition: background-color var(--m-base) var(--e-swift), box-shadow var(--m-base) var(--e-swift), transform var(--m-base) var(--e-over); pointer-events: none; }
      .x-card.is-on { --bt0: var(--x-ok); }
      .x-card.is-on:not([class*="x-b"])::before { box-shadow: 0 0 0 3px color-mix(in srgb, var(--x-ok) 22%, transparent), 0 0 8px color-mix(in srgb, var(--x-ok) 55%, transparent); }
      .x-card.is-on-new::before { animation: x-lampon 420ms var(--e-over); }
      @keyframes x-lampon { 0% { transform: scale(.4); } 60% { transform: scale(1.5); } 100% { transform: none; } }
      .x-card:hover { border-color: var(--x-ln-h); box-shadow: var(--x-sh-h); }
      .x-card.is-sel { outline-color: var(--x-acc); }
      .x-card.is-target, .x-card.is-guide { background: var(--x-acc-l); color: var(--x-acc); border-color: var(--x-acc); outline-color: var(--x-acc-r); }
      .x-card.is-deny { outline: 1.5px dashed var(--x-ink3); outline-offset: 3px; }
      /* lift: 120ms snap, scale 1.03 + soft deep shadow; the base transition brings it down with no overshoot */
      .x-card.is-tap-src { outline: 2px solid var(--x-acc); outline-offset: 2px; }
      .x-port.is-tap-src { background: var(--x-acc); }
      .x-card.is-drag { cursor: grabbing; z-index: 2; scale: 1.03; border-color: var(--x-ln-h); box-shadow: var(--x-sh-drag); transition: box-shadow var(--m-snap) var(--e-snap), scale var(--m-snap) var(--e-snap); }
      .x-card.is-root-done { background: var(--x-acc); color: #fff; border-color: var(--x-acc); transition: background-color var(--m-slow) var(--e-out), color var(--m-slow) var(--e-out), border-color var(--m-slow) var(--e-out), outline-color var(--m-base) var(--e-swift), box-shadow var(--m-snap) var(--e-snap), opacity var(--m-base) var(--e-swift), scale var(--m-snap) var(--e-snap); }
      .x-card.is-root-done::before { background: rgba(255,255,255,.85); }
      .x-port { position: absolute; right: -4px; top: 50%; width: 8px; height: 8px; margin-top: -4px; box-sizing: border-box; border-radius: 50%; background: var(--x-acc); border: 1.5px solid #fff; box-shadow: 0 0 0 1px var(--x-acc-r); cursor: crosshair; opacity: 0; transition: transform var(--m-snap) var(--e-snap), opacity var(--m-snap) var(--e-out); }
      .x-card:not(.is-on) .x-port { opacity: .35; }
      .x-card:hover .x-port, .x-card.x-near .x-port, .x-card.is-target .x-port, .x-board.is-linking .x-card.x-can .x-port { opacity: 1; }
      .x-port::before { content: ""; position: absolute; left: 50%; top: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; transform: scale(var(--inv, 1)); }
      .x-card:hover .x-port { transform: scale(1.6); }
      .x-card:hover .x-port::before { transform: scale(calc(var(--inv, 1) / 1.6)); }
      .x-board.is-linked .x-port { display: none; }
      @media (hover: none) { .x-port { opacity: .55; } }
      /* guide: dashed indigo line (JS sets the dash and marching offset); widths follow the zoom */
      .x-guide line { fill: none; stroke: var(--x-acc); stroke-width: calc(2px * var(--inv, 1)); stroke-linecap: round; }
      .x-guide circle { fill: var(--x-acc); stroke: #fff; }
      .x-fig { font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -.03em; margin: 16px 0 4px; font-variant-numeric: tabular-nums; }
      .x-weak { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
      /* landing / correct link: 260ms overshoot, peak 1.04; always composed after --pos so it never displaces */
      .is-pop { animation: x-pop 260ms var(--e-over); }
      .x-card, .x-lslot, .x-mslot { transform: var(--pos, none); }
      @keyframes x-pop { 0%, 100% { transform: var(--pos, none); } 45% { transform: var(--pos, none) scale(1.04); } }
      .is-shake { animation: x-shake var(--m-sheet) ease-in-out; }
      @keyframes x-shake { 0% { translate: 0 0; } 25% { translate: 6px 0; } 50% { translate: -4px 0; } 75% { translate: 2px 0; } 100% { translate: 0 0; } }
      /* error: soft red tint, red border and red text */
      .x-card.is-bad, .x-card.is-bad:hover { border-color: var(--x-bad); outline-color: transparent; background: var(--x-bad-l); color: var(--x-bad); box-shadow: 0 0 0 3px rgba(220,38,38,.12); transition: none; }
      .x-card.is-bad::before { background: var(--x-bad); }
      .x-card.is-bad .x-port { background: var(--x-bad); box-shadow: none; }
      .x-edge.is-retract .ln { marker-end: none; transition: stroke-dashoffset 180ms ease-in; }
      /* branches: --bt is the card's dot, --bl the line, same colour */
      .x-b0 { --bl: var(--x-br0); --bt: var(--x-br0); }
      .x-b1 { --bl: var(--x-br1); --bt: var(--x-br1); }
      .x-b2 { --bl: var(--x-br2); --bt: var(--x-br2); }
      .x-b3 { --bl: var(--x-br3); --bt: var(--x-br3); }
      .x-b4 { --bl: var(--x-br4); --bt: var(--x-br4); }
      .x-b5 { --bl: var(--x-br5); --bt: var(--x-br5); }
      /* locked into a branch: border tinted with the branch colour at 40% */
      .x-card:where([class*="x-b"]) { border-color: color-mix(in srgb, var(--bt) 40%, #FFFFFF); }
      .x-edge[class*="x-b"] .ln { stroke: var(--bl); stroke-width: 2; stroke-dasharray: none; }
      .x-edge.x-b0 .ln { marker-end: url(#m-b0); } .x-edge.x-b1 .ln { marker-end: url(#m-b1); } .x-edge.x-b2 .ln { marker-end: url(#m-b2); }
      .x-edge.x-b3 .ln { marker-end: url(#m-b3); } .x-edge.x-b4 .ln { marker-end: url(#m-b4); } .x-edge.x-b5 .ln { marker-end: url(#m-b5); }
      .x-mk { fill: none; stroke: var(--bl); }
      .x-mslot, .x-lslot { height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0 8px; border: 1px dashed var(--x-ln-h); border-radius: 8px; background: var(--x-card); font: 400 12px/1 var(--x-font); color: var(--x-ink2); white-space: nowrap; pointer-events: auto; transition: background-color var(--m-base) var(--e-swift), border-color var(--m-base) var(--e-swift), color var(--m-base) var(--e-swift); }
      .x-mslot { position: absolute; top: calc(100% + 8px); left: 50%; --pos: translateX(-50%); transform: var(--pos); min-width: 80px; }
      .x-lslot { position: absolute; left: 0; top: 0; min-width: 64px; transition: background-color var(--m-base) var(--e-swift), border-color var(--m-base) var(--e-swift), color var(--m-base) var(--e-swift), opacity var(--m-base) var(--e-swift); }
      .x-mslot[hidden] { display: none; }
      /* slot states: none (not rendered) → dot (6px round anchor) → near (dashed indigo ghost, only while dragging a chip of its kind) → filled → ok */
      .x-mslot.is-dot, .x-lslot.is-dot { width: 6px; height: 6px; min-width: 0; padding: 0; border: 0; border-radius: 50%; background: var(--x-ln-h); color: transparent; overflow: hidden; pointer-events: none; transition: background-color var(--m-snap) var(--e-out), box-shadow var(--m-snap) var(--e-out), opacity var(--m-base) var(--e-swift); }
      .x-mslot.is-dot { top: calc(100% + 16px); opacity: .5; }
      .x-board.x-arm-3 .x-mslot.is-dot, .x-card:hover .x-mslot.is-dot { opacity: 1; }
      .x-board.x-arm-2 .x-lslot.is-dot, .x-board.x-arm-3 .x-mslot.is-dot { background: var(--x-acc); box-shadow: 0 0 0 3px var(--x-acc-r); }
      .x-lslot.is-new { animation: x-dotin var(--m-sheet) var(--e-out) var(--m-base) backwards; }
      .x-mslot.is-new { animation: x-dotin var(--m-sheet) var(--e-out) backwards; }
      @keyframes x-dotin { from { opacity: 0; transform: var(--pos, none) scale(.3); } }
      .x-mslot.is-near, .x-lslot.is-near { pointer-events: none; border: 1.5px dashed var(--x-acc); border-radius: 8px; background: var(--x-acc-l); color: var(--x-acc); animation: x-ghost var(--m-snap) var(--e-out); }
      @keyframes x-ghost { from { opacity: 0; } }

      .x-mslot.is-bad, .x-lslot.is-bad { background: var(--x-bad-l); border: 1px solid var(--x-bad); color: var(--x-bad); }
      .x-mslot.is-target, .x-lslot.is-target { border: 1px solid var(--x-acc); background: var(--x-acc-l); color: var(--x-acc); box-shadow: 0 0 0 3px var(--x-acc-r); }
      .x-lslot.is-static { border: 1px solid var(--x-ln); background: var(--x-card); color: var(--x-ink2); pointer-events: none; }
      .x-marq { position: absolute; border: 1px solid var(--x-acc); background: rgba(79,70,229,.08); pointer-events: none; border-radius: 4px; }

{
  "id": "atomic-habits",
  "title": "原子习惯",
  "subtitle": "詹姆斯·克利尔",
  "intro": "组装《原子习惯》：习惯怎么形成，又怎么一步步建立。",
  "kind": "book",
  "shape": "sequence",
  "parts": [
    {
      "id": "root",
      "label": "《原子习惯》",
      "parent": null,
      "note": "微小改变，巨大成就",
      "explain": "詹姆斯·克利尔 2018 年的书。核心观点：大改变来自很多微小习惯的累积，而习惯是可以被设计的。"
    },
    {
      "id": "basics",
      "label": "基础",
      "parent": "root",
      "note": "小习惯为何重要",
      "explain": "全书开头先讲为什么值得从很小的习惯做起。"
    },
    {
      "id": "onepct",
      "label": "每天进步1%",
      "parent": "basics",
      "note": "复利效应",
      "explain": "每天好 1%，一年后约是原来的 37 倍；每天差 1%，会接近零。习惯像复利，短期看不出，长期差别巨大。"
    },
    {
      "id": "systems",
      "label": "系统胜于目标",
      "parent": "basics",
      "note": "关注过程",
      "explain": "目标是想要的结果，系统是每天做的流程。赢家和输家目标都一样，差别在系统。专注于改进过程，而不是盯着结果。"
    },
    {
      "id": "identity",
      "label": "基于身份的习惯",
      "parent": "basics",
      "note": "成为那种人",
      "explain": "不只说「我要跑完马拉松」，而是先认定「我是一个跑步的人」。每做一次，都是在给这个身份投一票。"
    },
    {
      "id": "plateau",
      "label": "潜能潜伏期",
      "parent": "basics",
      "note": "突破前看不到",
      "explain": "习惯带来的成果常常要积累很久才突然显现，就像冰块在 0 度前看不出变化。很多人在这段时间放弃。"
    },
    {
      "id": "loop",
      "label": "习惯回路",
      "parent": "root",
      "note": "习惯的四个阶段",
      "explain": "书中把每个习惯拆成固定的几个阶段，它们一圈圈循环，让行为变得自动。"
    },
    {
      "id": "cue",
      "label": "提示",
      "parent": "loop",
      "note": "触发行为",
      "order": 1,
      "explain": "让大脑想到要做某件事的信号，比如手机震动、闻到咖啡香、到了晚上九点。"
    },
    {
      "id": "craving",
      "label": "渴求",
      "parent": "loop",
      "note": "行为的动机",
      "order": 2,
      "explain": "看到信号后，心里对某种状态变化的「想要」。你想要的不是刷手机本身，而是刷手机带来的放松。"
    },
    {
      "id": "response",
      "label": "反应",
      "parent": "loop",
      "note": "实际做的事",
      "order": 3,
      "explain": "你真正做出的那个动作或想法，比如拿起手机、去跑步。"
    },
    {
      "id": "reward",
      "label": "奖励",
      "parent": "loop",
      "note": "满足渴求",
      "order": 4,
      "explain": "行为带来的满足感。它告诉大脑「下次还要这样做」，让循环继续。"
    },
    {
      "id": "laws",
      "label": "四大定律",
      "parent": "root",
      "note": "对应回路四步",
      "explain": "克利尔给出的建立好习惯的四条方法，反过来用就是戒掉坏习惯的方法。"
    },
    {
      "id": "law1",
      "label": "让它显而易见",
      "parent": "laws",
      "note": "提示要看得见",
      "order": 1,
      "explain": "想养成的习惯，要让它的信号容易被看到；想戒掉的，就把信号藏起来。"
    },
    {
      "id": "stack",
      "label": "习惯叠加",
      "parent": "law1",
      "note": "接在旧习惯后",
      "explain": "把新习惯接在已有的习惯后面：「倒完咖啡后，我就冥想一分钟。」"
    },
    {
      "id": "intent",
      "label": "执行意图",
      "parent": "law1",
      "note": "定好时间地点",
      "explain": "写清楚「我会在【时间】【地点】做【行为】」。比起「我要多运动」，明确的计划成功率高得多。"
    },
    {
      "id": "env",
      "label": "环境设计",

      showAll = !showAll; $("allBtn").setAttribute("aria-pressed", showAll ? "true" : "false");
      moreOpen(false); loadPack(P.id);
      toast(showAll ? "全部摆出 · 已重新开始" : "逐层解锁 · 已重新开始");
      return;
    }
    var b = e.target.closest("[data-for]"); if (!b) return;
    var src = $(b.dataset.for); src.click();
    if (src.id === "shuffleBtn" && armT) { b.textContent = src.textContent; return; }
    moreOpen(false);
  });
  document.addEventListener("pointerdown", function (e) { if (!$("moreMenu").hidden && !e.target.closest("#moreMenu, #moreBtn")) moreOpen(false); }, true);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("moreMenu").hidden) { moreOpen(false); $("moreBtn").focus(); } });
  $("fileIn").addEventListener("change", function () {
    var f = this.files && this.files[0]; this.value = "";
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try { var p = register(validate(JSON.parse(rd.result)), true); loadPack(p.id); toast("已导入「" + p.title + "」"); }
      catch (err) { toast("导入失败：" + (err instanceof SyntaxError ? "不是有效的 JSON" : err.message), "err"); }
    };
    rd.onerror = function () { toast("读取失败", "err"); };
    rd.readAsText(f);
  });


  /* ---------- progress persistence (Fix 2) ----------
     packs/*.json is the source of truth for content; localStorage only
     stores the learner's own progress for the current pack.
     Saved: locked tree edges, visibility, refs, done flags, chip answers,
     card positions. Chips are restored by answer text, not by tray index,
     so a shuffled tray order does not break restore. If storage is
     unavailable (sandboxed iframe / file://), progress is simply not saved. */
  function saveProgress() {
    if (!P || !S) return;
    try {
      var data = { v: 1, packId: P.id, lock: S.lock, par: S.par, vis: S.vis, done: S.done, refs: S.refs,
        pos: pos, chips: { 2: Object.keys((S.s2 && S.s2.ok) || {}), 3: Object.keys((S.s3 && S.s3.ok) || {}) } };
      localStorage.setItem("kabProgress", JSON.stringify(data));
    } catch (err) { /* sandboxed: no storage */ }
  }
  function clearProgress() {
    try { localStorage.removeItem("kabProgress"); } catch (err) {}
  }
  function restoreProgress() {
    if (!P || !S) return false;
    var raw = null;
    try { raw = localStorage.getItem("kabProgress"); } catch (err) { return false; }
    if (!raw) return false;
    var d = null;
    try { d = JSON.parse(raw); } catch (err) { return false; }
    if (!d || d.packId !== P.id || !d.lock) return false;
    var ok = true;
    Object.keys(d.lock).forEach(function (id) { if (byId[id] && d.par[id] && byId[d.par[id]]) { S.lock[id] = true; S.par[id] = d.par[id]; } });
    Object.keys(d.vis || {}).forEach(function (id) { if (byId[id]) S.vis[id] = true; });
    Object.keys(d.refs || {}).forEach(function (k) { S.refs[k] = true; });
    if (d.done) S.done = d.done;
    if (d.pos) { Object.keys(d.pos).forEach(function (id) { if (pos[id] && d.pos[id]) pos[id] = d.pos[id]; }); }
    // chips by answer text
    [2, 3].forEach(function (n) {
      var o = stObj(n); if (!o) return;
      (d.chips && d.chips[n] || []).forEach(function (id) {
        if (!byId[id]) return;
        var want = answer(n, id);
        var ci = o.chips.findIndex(function (c, i) { return c.text === want && c.at == null && !o.fill[id]; });
        if (ci < 0) return;
        o.fill[id] = ci; o.chips[ci].at = id; o.ok[id] = true;
      });
    });
    return true;
  }
  /* ---------- tap / click-to-connect + keyboard (Fix 4) ----------
     Drag is still the primary path. Tap is the alternative for touch and
     keyboard users: tap a port (or focus a card and press Enter) to arm
     it as the source, then tap / Enter on the target card to connect.
     Esc cancels. This does not change drag behaviour: a drag that ends
     on a different card never fires a click on that card, so tap state
     is only set by a tap (down+up on the same port/card). */
  var tapSrc = null;
  function clearTapSrc() {
    tapSrc = null;
    P && P.parts.forEach(function (q) { if (els[q.id]) els[q.id].classList.remove("is-tap-src"); });
  }
  function armTapSrc(id) {
    clearTapSrc(); tapSrc = id;
    if (els[id]) els[id].classList.add("is-tap-src");
    toast("已选起点「" + byId[id].label + "」，再点目标卡连线，Esc 取消");
  }
  board.addEventListener("click", function (e) {
    if (!P || !S || drag) return;
    var port = e.target.closest && e.target.closest(".x-port");
    if (port) {
      var src = port.parentNode && port.parentNode.dataset && port.parentNode.dataset.id;
      if (src) { if (tapSrc === src) clearTapSrc(); else armTapSrc(src); }
      return;
    }
    var card = e.target.closest && e.target.closest(".x-card");
    if (card && tapSrc && card.dataset.id !== tapSrc) {
      var to = card.dataset.id;
      if (canLink(tapSrc, to)) { connect(tapSrc, to); saveProgress(); }
      else toast("这两张卡不能连");
      clearTapSrc();
    }
  });
  board.addEventListener("keydown", function (e) {
    if (!P || !S) return;
    if (e.key === "Escape" && tapSrc) { clearTapSrc(); return; }
    if ((e.key === "Enter" || e.key === " ") && tapChip && e.target && e.target.dataset && e.target.dataset.slot) {
      e.preventDefault();
      var kind2 = e.target.classList.contains("x-lslot") ? 2 : 3;
      if (kind2 === tapChip.kind) { putChip(kind2, e.target.dataset.slot, tapChip.ci, null); saveProgress(); }
      clearTapChip(); return;
    }
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.classList && e.target.classList.contains("x-card")) {
      e.preventDefault();
      var id = e.target.dataset.id;
      if (tapSrc && tapSrc !== id) {
        if (canLink(tapSrc, id)) { connect(tapSrc, id); saveProgress(); } else toast("这两张卡不能连");
        clearTapSrc();
      } else if (tapSrc === id) clearTapSrc();
      else armTapSrc(id);
    }
  });


  /* ---------- chip tap-to-place (Frontend 1, completes tap/keyboard path) ----------
     Drag is still primary. Tap: tap a tray chip to arm it, then tap an
     open slot to place it. Keyboard: chip buttons are <button>, so Enter
     arms the chip; slots are made focusable in slotView, Enter on a slot
     places the armed chip. Esc cancels. A tap that ends as a drag never
     fires a click on the slot, so tap state is only set by a tap. */
  var tapChip = null;
  function clearTapChip() {
    tapChip = null;
    document.querySelectorAll(".x-chip.is-tap-chip").forEach(function (el) { el.classList.remove("is-tap-chip"); });
    document.querySelectorAll(".is-tap-target").forEach(function (el) { el.classList.remove("is-tap-target"); });
  }
  function armTapChip(kind, ci, el) {
    clearTapChip(); tapChip = { kind: kind, ci: ci };
    if (el) el.classList.add("is-tap-chip");
    // highlight open slots of this kind
    [2, 3].forEach(function (n) { if (n !== kind) return; openSlots(n).forEach(function (id) { var s = slotEl(n, id); if (s) s.classList.add("is-tap-target"); }); });
    toast("已选词块「" + stObj(kind).chips[ci].text + "」，再点一个空槽放进去，Esc 取消");
  }
  chipsEl.addEventListener("click", function (e) {
    if (!P || !S || drag) return;
    var chip = e.target.closest && e.target.closest(".x-chip");
    if (!chip) return;
    var kind = +chip.dataset.kind, ci = +chip.dataset.chip;
    if (tapChip && tapChip.kind === kind && tapChip.ci === ci) clearTapChip();
    else armTapChip(kind, ci, chip);
  });
  board.addEventListener("click", function (e) {
    if (!P || !S || drag || !tapChip) return;
    var slot = e.target.closest && e.target.closest("[data-slot]");
    if (!slot) return;
    var kind = slot.classList.contains("x-lslot") ? 2 : 3;
    if (kind !== tapChip.kind) { toast("这个槽不是这类词块的"); return; }
    var id = slot.dataset.slot;
    if (!openSlots(kind).some(function (x) { return x === id; }) && !stObj(kind).ok[id]) {
      // putChip will reject if not available; still try for filled-but-wrong slots via unChip path is not allowed, so only open slots
      if (stObj(kind).ok[id]) { toast("这个槽已经对了"); clearTapChip(); return; }
    }
    putChip(kind, id, tapChip.ci, null);
    saveProgress();
    clearTapChip();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && tapChip) { clearTapChip(); return; }
    if (e.key === "Escape" && tapSrc) { /* tapSrc Esc already handled in board keydown */ }
  });


  /* ---------- export completed assembly (Frontend 2) ---------- */
  function exportAssembly() {
    if (!P || !S) return;
    var outline = [];
    var walk = function (id, d) {
      var q = byId[id]; if (!q) return;
      outline.push("  ".repeat(d) + "- " + q.label + (q.note ? "（" + q.note + "）" : ""));
      P.parts.filter(function (x) { return x.parent === id; }).forEach(function (x) { walk(x.id, d + 1); });
    };
    walk(P.root, 0);
    var data = { v: 1, pack: { id: P.id, title: P.title }, exportedAt: new Date().toISOString(),
      tree: S.par, locked: Object.keys(S.lock), refs: Object.keys(S.refs),
      chips: { 2: Object.keys((S.s2 && S.s2.ok) || {}), 3: Object.keys((S.s3 && S.s3.ok) || {}) },
      progress: { tree: correctCount(1) + "/" + total(1), relation: correctCount(2) + "/" + total(2), meaning: correctCount(3) + "/" + total(3) },
      outline: outline.join("\n") };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = P.id + "-assembly.json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("已导出组装结果");
  }

  /* ---------- load ---------- */
  function loadPack(id) {
    P = PACKS[id]; if (!P) return;
    resetSideMem();
    byId = M(); C = M(); LAB = M();
    P.parts.forEach(function (q) { byId[q.id] = q; C[q.id] = q.parent; });
    P.links.forEach(function (l) { LAB[l.b] = l.label; });
    newState(); /* creates S with both chip pools: S.s2 = makeChips(2), S.s3 = makeChips(3) */
    combo = 0; S.bestCombo = 0; sfx.reset(); renderCombo();
    document.title = "知识组装台 · " + P.title;
    closeOverlay();
    buildCards(); scatter(); renderAll(); renderPackList();
    var restored = false;
    try { restored = restoreProgress(); } catch (err) { restored = false; }
    if (restored) {
      P.parts.forEach(function (q) { if (els[q.id]) placeEl(q.id); });
      applyVis(); renderAll(); renderPackList();
      toast("已恢复上次进度");
    }
    fitView(false, null, null, fitFloor());
  }
  /* opening zoom never drops below legible card text; pan for the rest */
  function fitFloor() { return window.innerWidth <= 600 ? 0.6 : 0.7; }
  /* 详情默认打开：移动端和桌面端一致，不再在 ≤900px 时自动关闭 */
  ["pack-stoicism", "pack-thinking-fast-and-slow", "pack-atomic-habits"].forEach(function (k) {
    try { register(validate(JSON.parse($(k).textContent)), false); }
    catch (err) { toast("内置包读取失败：" + err.message, "err"); }
  });
  applyView();
  if (order.length) loadPack(order[0]);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (P) { measure(); updateEdges(); } });
  window.addEventListener("resize", function () { if (P && !drag) applyView(); });
})();
    </script>
  </body>
